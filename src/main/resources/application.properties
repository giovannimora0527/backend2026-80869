spring.profiles.active=dev

# ---- Autenticación (login + OTP + JWT) ----
app.jwt.secret=ClinicaUniminutoSecretoJwt2026ClaveLargaParaFirmar
app.jwt.expiracion-minutos=60
# true = todos los endpoints (menos /auth) exigen el token JWT
app.jwt.proteger-endpoints=true
app.otp.expiracion-minutos=5
app.otp.max-intentos=3
# true = imprime el código OTP en la consola del backend (solo para desarrollo)
app.otp.mostrar-en-consola=true
