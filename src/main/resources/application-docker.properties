# ============================================================
#  Perfil "docker" - Configuracion para el despliegue con contenedores
# ============================================================
#
#  Este perfil se activa cuando la aplicacion corre dentro de Docker
#  (lo fija el Dockerfile con SPRING_PROFILES_ACTIVE=docker). Toma los
#  valores desde variables de entorno definidas en docker-compose.yml,
#  de modo que no quedan credenciales quemadas en el codigo.
#
#  La sintaxis ${VARIABLE:valor_por_defecto} usa la variable de entorno
#  si existe y, si no, el valor por defecto indicado. El host de la base
#  de datos por defecto es "mysql", que es el nombre del servicio de
#  MySQL dentro de la red de docker-compose.
# ============================================================

spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

# ---------- Conexion a la base de datos ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:clinica}?zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:clinica123}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Correo (SMTP) ----------
# Se toma de variables de entorno. Si no se configuran, el envio de
# correo (OTP de doble factor) fallara; para la demostracion puede
# definirse en docker-compose.yml o en un archivo .env.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.to=${MAIL_TO:}

# ---------- Seguridad (JWT) ----------
# La propiedad se llama JWT_SECRET (asi la lee el codigo con @Value). Su valor
# puede sobreescribirse con la variable de entorno JWT_SECRET_ENV; si no se
# define, se usa la clave por defecto. Se usa un nombre de variable distinto
# (JWT_SECRET_ENV) para evitar una referencia circular con la propia propiedad.
JWT_SECRET=${JWT_SECRET_ENV:2YAcKLHKx2emdFlZP3Nmzflkf6p33eKNpDzuDYju0CluFJmpd3cPG1BF2YsFN3vvbBwiZDeJ9Mq/NhWBJNuhSA==}

# ---------- Documentacion de la API (Swagger) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Carga masiva de inventario ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
