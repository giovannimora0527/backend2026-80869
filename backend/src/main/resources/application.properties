spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

# Conexion H2 embebida (sin MySQL externo)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:./clinica_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Consola H2 web en http://localhost:8080/clinica/v1/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cargar datos de prueba automáticamente (DataLoader CommandLineRunner)
spring.sql.init.mode=never